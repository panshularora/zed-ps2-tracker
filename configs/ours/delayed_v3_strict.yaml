#   * margin 0.02 (was 0.03) and min_gain 0.3 (was 0.05): an alternative must win clearly.
# Delayed assignment stays OFF in every other config (DelayedAssignmentConfig.enabled = false).
inherit: delayed_v2_reid.yaml
delayed:
  margin: 0.02
  min_gain: 0.3
  trigger_require_all: true
