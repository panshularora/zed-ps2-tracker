# Ours, delayed decision only: ByteTrackLike + K-frame look-ahead on ambiguous first associations
# (tracker/delayed.py). Near-online: algorithmic delay K frames = 1000*K/fps ms.
# Variant chosen on MOT17 train_half, public FRCNN, K = 5 (docs/results/go_no_go.md):
# confirmed_only (lost tracks stay out of clusters) was the only variant not below the baseline.
inherit: ../baselines/bytetrack.yaml
delayed:
  enabled: true
  max_delay_frames: 5
  margin: 0.05
  max_cluster: 4
  max_hypotheses: 6
  miss_penalty: 1.0
  min_gain: 0.0
  confirmed_only: true
  same_tracks: false
