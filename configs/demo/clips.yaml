    page: https://www.pexels.com/video/bustling-mexico-city-metro-entrance-30138564/
    file: mexico_city_entrance_30138564.mp4
    note: Longest and densest crowd; the occlusion stress clip (111 s; run with a frame limit on CPU).
    consent: false
    event_styling: neutral
    gate: [0.0, 0.6, 1.0, 0.6]
