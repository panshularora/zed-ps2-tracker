# Hybrid-SORT (Yang et al., AAAI 2024), IoU/motion variant (no re-ID): OC-SORT + TCM (score in
# the Kalman state, score-difference cost), ROCM (4-corner direction consistency), HMIoU, BYTE.
# Source: ymzis69/HybridSORT @ 396f8d3. MIT, Copyright (c) 2021 Yifu Zhang.
# Values: exps/example/mot/yolox_x_ablation_hybrid_sort.py (the MOT17 val-half exp) and
# utils/args.py defaults; Hybrid_Sort(max_age=30, min_hits=3) in hybrid_sort.py.
# The evaluator's per-sequence track_thresh overrides are NOT applied.
name: hybrid_sort
detection:
  high_thresh: 0.6        # utils/args.py --track_thresh 0.6
  low_thresh: 0.1         # hybrid_sort.py: inds_low = scores > 0.1
lifecycle:
  min_hits: 3             # Hybrid_Sort(min_hits=3)
  track_buffer: 30        # Hybrid_Sort(max_age=30); the evaluator does not pass track_buffer
ocsort:
  iou_threshold: 0.25     # exp: self.iou_thresh = 0.25
  delta_t: 3              # utils/args.py --deltat 3
  inertia: 0.05           # exp: self.inertia = 0.05 (per corner)
  use_byte: true          # exp: self.use_byte = True
  oru: true
  ocr: true
  asso: hmiou             # exp: self.asso = "Height_Modulated_IoU"
  tcm_first_weight: 1.0   # exp: TCM_first_step_weight = 1.0
  tcm_byte_weight: 1.0    # exp: TCM_byte_step_weight = 1.0
cmc:
  method: none
output:
  min_box_area: 100       # utils/args.py --min-box-area 100
  max_aspect_ratio: 1.6   # mot_evaluator: vertical = w/h > 1.6 (MOT17/MOT20)
