# BoT-SORT MOT20 settings: tools/track.py `--default-parameters` for MOT20 sets match_thresh 0.7
# and args.mot20 = True (no score fusion); thresholds stay 0.6 / 0.1 / 0.7. Its per-sequence
# overrides (MOT20-06/08 track_high_thresh 0.3; MOT17-05/06/13/14 buffers) are NOT applied.
inherit: botsort.yaml
association:
  match_thresh: 0.7
  fuse_score: false
