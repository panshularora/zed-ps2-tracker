# CI for zed-ps2-tracker.
#
# NOTE: this file lives in docs/ci/ because the token used to create the repo lacks the `workflow`
# scope. To enable it, add it through the GitHub UI as .github/workflows/ci.yml
# (Add file -> Create new file -> paste), or `git mv docs/ci/github-actions.yml .github/workflows/ci.yml`
# from a machine whose credentials have the `workflow` scope.
#
# Jobs: `check` (ruff, mypy, pytest), `web` (eslint, tsc, vitest, vite build for web/ and the
# MOT17 viewer), `regression` (MOT17 smoke numbers with TrackEval), `docker` (builds both images).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up env
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv -e ".[dev]"
      - name: make check (ruff, mypy --strict tracker/, pytest)
        run: make check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            viewer/package-lock.json
      - name: web/ (eslint, tsc, vitest, build)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: viewer/ (vitest, build)
        working-directory: viewer
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [check, web]
    steps:
      - uses: actions/checkout@v4
      - name: backend image
        run: docker build -t zed-ps2-demo .
      - name: frontend image
        run: docker build -f web/Dockerfile -t zed-ps2-web .
      - name: compose config
        run: docker compose config -q

  regression:
    # Pins the phase-1 smoke numbers (MOT17-09 val-half, public FRCNN dets) with TrackEval.
    # Downloads MOT17Labels.zip (labels + public detections only, ~10 MB, no images).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up env
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv -e ".[dev]"
      - name: MOT17 labels
        run: make data/MOT17/train
      - name: regression test + full smoke run
        run: |
          .venv/bin/python -m pytest -q -m data
          make eval SPLIT=val_half
